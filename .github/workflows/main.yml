name: MAZEN_RDP_PORTABLE_FINAL

on:
  repository_dispatch:
    types: [start_rdp]
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # أقصى حد للـ GitHub-hosted runners هو 6 ساعات

    steps:
      - name: Setup Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="AllowRDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create User Mazen
        run: |
          $password = ConvertTo-SecureString "maAen@3" -AsPlainText -Force
          if (Get-LocalUser -Name "Mazen" -ErrorAction SilentlyContinue) { Remove-LocalUser -Name "Mazen" }
          New-LocalUser -Name "Mazen" -Password $password -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Mazen"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait

      - name: Start Connection & Telegram Bot Controller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Continue"

          # ---------- Tailscale ----------
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=mazen-pc
          Start-Sleep -Seconds 5
          $tsIP = (& $ts ip -4 | Select-Object -First 1)
          if (-not $tsIP) { $tsIP = "NOT_FOUND" }

          $token  = $env:TELEGRAM_BOT_TOKEN
          $chatId = $env:TELEGRAM_CHAT_ID
          $startTime = Get-Date

          # ---------- Helper: إرسال طلب لتليجرام بـ UTF-8 ----------
          function Invoke-Tg {
              param([string]$Method, [hashtable]$Body)
              $json  = $Body | ConvertTo-Json -Depth 10 -Compress
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/$Method" `
                                -Method Post -Body $bytes `
                                -ContentType "application/json; charset=utf-8"
          }

          function Build-Text {
              param([string]$TimeText)
              return "🚀 <b>Mazen RDP يعمل حالياً</b>`n`n" +
                     "🌐 <b>IP:</b> <code>$tsIP</code>`n" +
                     "👤 <b>User:</b> <code>Mazen</code>`n" +
                     "🔑 <b>Pass:</b> <code>maAen@3</code>`n" +
                     "⏱ <b>المدة المستهلكة:</b> $TimeText"
          }

          $keyboard = @{
              inline_keyboard = @(
                  ,@(
                      @{ text = "🛑 إيقاف السيرفر الآن"; callback_data = "stop_server" }
                  )
              )
          }

          # ---------- تنظيف أي ضغطات قديمة على الزر ----------
          $offset = 0
          try {
              $old = Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/getUpdates?offset=-1" -Method Get
              if ($old.ok -and $old.result.Count -gt 0) {
                  $offset = $old.result[-1].update_id + 1
              }
          } catch {}

          # ---------- الرسالة الأولى ----------
          $response = Invoke-Tg -Method "sendMessage" -Body @{
              chat_id      = $chatId
              text         = (Build-Text "0 دقيقة")
              parse_mode   = "HTML"
              reply_markup = $keyboard
          }
          $messageId = $response.result.message_id

          # ---------- اللوب الرئيسي ----------
          while ($true) {
              Start-Sleep -Seconds 10

              $elapsed = (Get-Date) - $startTime
              $timeStr = "$([int]$elapsed.TotalMinutes) دقيقة و $($elapsed.Seconds) ثانية"

              # تحديث الرسالة
              try {
                  Invoke-Tg -Method "editMessageText" -Body @{
                      chat_id      = $chatId
                      message_id   = $messageId
                      text         = (Build-Text $timeStr)
                      parse_mode   = "HTML"
                      reply_markup = $keyboard
                  } | Out-Null
              } catch {}

              # فحص ضغطة زر الإيقاف
              try {
                  $updates = Invoke-RestMethod -Uri "https://api.telegram.org/bot$token/getUpdates?offset=$offset&timeout=1" -Method Get
                  if ($updates.ok -and $updates.result.Count -gt 0) {
                      foreach ($update in $updates.result) {
                          $offset = $update.update_id + 1

                          if ($update.callback_query -and $update.callback_query.data -eq "stop_server") {
                              try {
                                  Invoke-Tg -Method "answerCallbackQuery" -Body @{
                                      callback_query_id = $update.callback_query.id
                                      text              = "جاري إيقاف السيرفر وتوفير ساعاتك..."
                                      show_alert        = $true
                                  } | Out-Null
                              } catch {}

                              $cancelUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID/cancel"
                              $headers = @{
                                  "Authorization" = "Bearer $env:GH_TOKEN"
                                  "Accept"        = "application/vnd.github+json"
                              }
                              Invoke-RestMethod -Uri $cancelUri -Method Post -Headers $headers
                              exit 0
                          }
                      }
                  }
              } catch {}
          }
